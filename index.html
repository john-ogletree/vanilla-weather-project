<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; max-width: 400px; }
        button { background: #38bdf8; border: none; padding: 0.5rem 1rem; color: #0f172a; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Weather Utility</h1>
        <button onclick="getWeather()">Get My Local Weather</button>
        <div id="output" style="margin-top: 1.5rem;">Click the button to load live forecast...</div>
    </div>

    <script>
        async function getWeather() {
            const output = document.getElementById('output');

            if (!navigator.geolocation) {
                output.textContent = "Geolocation is not supported by your browser.";
                return;
            }

            output.textContent = "Locating...";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                output.textContent = "Fetching forecast...";

                try {
                    // Open-Meteo free API endpoint (no key required)
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit`);
                    const data = await response.json();

                    const current = data.current_weather;
                    output.innerHTML = `
                        <p><strong>Temperature:</strong> ${current.temperature}°F</p>
                        <p><strong>Wind Speed:</strong> ${current.windspeed} mph</p>
                    `;
                } catch (err) {
                    output.textContent = "Error fetching weather data.";
                }
            }, () => {
                output.textContent = "Unable to retrieve your location.";
            });
        }
    </script>
</body>
</html>
